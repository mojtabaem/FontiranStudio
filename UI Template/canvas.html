<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontiran Studio</title>
    <link rel="stylesheet" href="css/fontface.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/tokens/-tokens.css">
    <link rel="stylesheet" href="css/layouts/-layouts.css">
    <link rel="stylesheet" href="css/components/-components.css">
    <link rel="stylesheet" href="css/pages/-pages.css">
    <link rel="stylesheet" href="css/vendor/tippy.js@6.3.7.scale.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-canvas">
    <div class="app" id="app">
        <section class="canvas" id="canvas"></section>
        <section class="menu" id="menu"></section>
        <section class="sidebar" id="sidebar"></section>
        <section class="toolbar" id="toolbar">
            <div class="toolbar-inner">
                <div class="toolbar-stream toolbar-stream-main">
                    <button class="toolbar-item toolbar-item-move is-active" id="tool-move" data-tippy-hint-template="hint-tool-move">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M4.83032 6.89883C4.29926 5.5933 5.59368 4.28829 6.90356 4.80899L19.2571 9.72012C20.6283 10.2656 20.5926 12.219 19.2024 12.7143L14.426 14.4145L12.8489 19.1303C12.3777 20.5382 10.4087 20.6011 9.84888 19.226L4.83032 6.89883Z" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                        </div>
                    </button>
                    <button class="toolbar-item toolbar-item-hand" id="tool-hand" data-tippy-hint-template="hint-tool-hand">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M10.9078 6.14835V10.1004M10.9078 6.14835C10.9078 5.32987 10.2443 4.66635 9.4258 4.66635C8.60731 4.66635 7.9438 5.32987 7.9438 6.14835L7.94845 13.1664L6.46835 11.189C5.97788 10.5337 5.04909 10.4001 4.39383 10.8906C3.73857 11.381 3.60498 12.3098 4.09544 12.9651L6.46835 16.5917C7.19687 17.835 9.40109 20.3216 12.3898 20.3216C18.4166 20.3216 19.7998 15.6286 19.7998 13.0644V8.12435C19.7998 7.30587 19.1363 6.64235 18.3178 6.64235C17.4993 6.64235 16.8358 7.30587 16.8358 8.12435M10.9078 6.14835V5.16035C10.9078 4.34187 11.5713 3.67835 12.3898 3.67835C13.2083 3.67835 13.8718 4.34187 13.8718 5.16035V6.14835M13.8718 6.14835V10.1004M13.8718 6.14835C13.8718 5.32987 14.5353 4.66635 15.3538 4.66635C16.1723 4.66635 16.8358 5.32987 16.8358 6.14835V8.12435M16.8358 8.12435V10.1004" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </button>
                    <button class="toolbar-item toolbar-item-text" id="tool-text" data-tippy-hint-template="hint-tool-text">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M8 10.0625V8H12M16 10.0625V8H12M12 8V16M12 16H14.5M12 16H9.5M7 20H17C18.6569 20 20 18.6569 20 17V7C20 5.34315 18.6569 4 17 4H7C5.34315 4 4 5.34315 4 7V17C4 18.6569 5.34315 20 7 20Z" stroke="currentColor" stroke-width="1.2"/>
                            </svg>
                        </div>
                    </button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="toolbar-stream toolbar-stream-view">
                    <button class="toolbar-item toolbar-item-zoom" id="tool-zoom" data-tippy-hint-template="hint-tool-zoom">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M19.4995 19.5L15.6372 15.6411M7.49951 10.6111H10.6106M10.6106 10.6111H13.7217M10.6106 10.6111V7.49997M10.6106 10.6111V13.7222M15.6372 15.6411C14.3505 16.927 12.5734 17.7222 10.6106 17.7222C6.68326 17.7222 3.49951 14.5385 3.49951 10.6111C3.49951 6.68372 6.68326 3.49997 10.6106 3.49997C14.538 3.49997 17.7217 6.68372 17.7217 10.6111C17.7217 12.5757 16.9251 14.3541 15.6372 15.6411Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </button>
                    <div class="input-control input-type-stepper zoom-stepper toolbar-zoom-stepper" id="zoom-stepper">
                        <div class="input-stepper-wrapper">
                            <button class="input-stepper-btn input-stepper-btn-decrement">-</button>
                            <input class="input" id="canvas-zoom" type="number" value="100" min="1" max="100" step="0.1">
                            <button class="input-stepper-btn input-stepper-btn-increment">+</button>
                        </div>
                    </div>
                </div>
                <div class="toolbar-divider"></div>
                <div class="toolbar-stream toolbar-stream-extras">
                    <!-- is-login or is-logout -->
                    <button class="toolbar-btn user-btn" id="user-btn" data-dialog-open="account-dialog" data-tippy-content="ورود به حساب کاربری">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M19 20C19 18.0567 19 17.085 18.6438 16.3226C18.2693 15.5211 17.6251 14.8695 16.8187 14.4764C16.0517 14.1025 15.0625 14 13.073 14.0044L10.9262 14C8.93749 14 7.97059 14.0916 7.21309 14.4526C6.38127 14.8489 5.72352 15.5129 5.34486 16.3386C5.00001 17.0906 5.00001 18.0603 5 19.9999M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </button>
                    <!-- disabled -->
                    <button class="toolbar-btn export-btn" id="export-btn" data-dialog-open="export-dialog">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M19.5 15.5V17.5C19.5 18.6046 18.6046 19.5 17.5 19.5H6.5C5.39543 19.5 4.5 18.6046 4.5 17.5V15.5M16 11.8125L12 15.8125L8 11.8125M12 15.8125V4.50003" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="text">دانلود</div>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!--
      Account dialog — class names match Radix Dialog parts (see dialog.css).
      Later with Radix: Dialog.Overlay.dialog-overlay, Dialog.Content.dialog-content, etc.
    -->
    <!-- <dialog class="dialog" id="account-dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <button class="dialog-btn dialog-btn-close" type="button" data-dialog-close aria-label="بستن">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M6 18L12 12M12 12L18 6M12 12L6 6M12 12L18 18" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="dialog-body"></div>
            <div class="dialog-footer"></div>
        </div>
    </dialog> -->

    <!-- export dialog -->
    <dialog class="dialog dialog-export" id="export-dialog">
        <div class="dialog-panel">
            <div class="dialog-content">
                <div class="dialog-header">
                    <button class="dialog-btn dialog-btn-close" type="button" data-dialog-close aria-label="بستن">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M6 18L12 12M12 12L18 6M12 12L6 6M12 12L18 18" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="dialog-header-title" style="display: none;">
                        <div class="dialog-header-title-text">دانلود</div>
                        <div class="dialog-header-title-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M19.5 15.5V17.5C19.5 18.6046 18.6046 19.5 17.5 19.5H6.5C5.39543 19.5 4.5 18.6046 4.5 17.5V15.5M16 11.8125L12 15.8125L8 11.8125M12 15.8125V4.50003" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="dialog-body">
                    <div class="dialog-export-content">
                        <div class="dialog-export-header">
                            <img src="assets/img/export-dialog-arrow.svg" class="dialog-export-arrow" alt="">
                        </div>
                        <div class="dialog-export-options"></div>
                        <div class="dialog-export-preview"></div>
                    </div>
                </div>
                <div class="dialog-footer">
                    <button class="ui-btn ui-btn-primary btn-export-download" id="export-btn-download">
                        <div class="text">دانلود</div>
                    </button>
                    <button class="ui-btn ui-btn-secondary btn-export-copy" id="export-btn-copy">
                        <div class="text">کپی در کلیپبورد</div>
                    </button>
                </div>
            </div>
        </div>
    </dialog>


    <div id="hint-tippy-templates" hidden>
        <div id="hint-tool-move">
            <div class="hint-tippy-wrapper hint-tool-move">
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Move</span>
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>V</kbd>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="hint-tool-hand">
            <div class="hint-tippy-wrapper hint-tool-hand">
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Hand</span>
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>H</kbd>
                        </div>
                        <span class="hint-tippy-or">or hold</span>
                        <div class="hint-tippy-key">
                            <kbd>Space</kbd>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="hint-tool-text">
            <div class="hint-tippy-wrapper hint-tool-text">
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Text</span>   
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>T</kbd>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="hint-tool-zoom">
            <div class="hint-tippy-wrapper hint-tool-zoom">
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Zoom in</span>   
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>Ctrl</kbd>
                        </div>
                        <div class="hint-tippy-key">
                            <kbd>+</kbd>
                        </div>
                    </div>
                </div>
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Zoom out</span>   
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>Ctrl</kbd>
                        </div>
                        <div class="hint-tippy-key">
                            <kbd>-</kbd>
                        </div>
                    </div>
                </div>
                <div class="hint-tippy-item">
                    <div class="hint-tippy-label">
                        <span>Reset to 100%</span>   
                    </div>
                    <div class="hint-tippy-shortcuts">
                        <div class="hint-tippy-key">
                            <kbd>Ctrl</kbd>
                        </div>
                        <div class="hint-tippy-key">
                            <kbd>0</kbd>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/vendor/popper.min@2.11.8.js"></script>
    <script src="js/vendor/tippy-bundle.umd.min@6.3.7.js"></script>
    <script src="js/tippy.js"></script>
    <script src="js/dialog.js"></script>
</body>
</html>
